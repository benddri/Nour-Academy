<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nour | Academy</title>
  <link rel="icon" href="/assets/Logo éducatif Nour Academy.png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
  <nav>
    <div>
      <a class="logo" href="index.html">
        <img src="/assets/Logo éducatif Nour Academy.png" alt="logo">
        Nour Academy
      </a>
    </div>
    <div class="cart-icon">
      <i class="fa-solid fa-cart-shopping"></i>
      <span id="cart-count">0</span>
    </div>
  </nav>

  <header class="page-header">
    <h1>Catalogue des cours</h1>
    <p>Découvrez nos cours de soutien et trouvez celui qui vous correspond.</p>
  </header>

  <div class="filters">
    <div>
      <label for="search">Rechercher un cours</label>
      <input type="text" id="search" placeholder="Exemple: Mathematiques...">
    </div>

    <div>
      <label for="niv">Niveau</label>
      <select id="niv">
        <option value="">Tous les niveaux</option>
        <option value="1ème année collège">1ème année collège</option>
        <option value="2ème année collège">2ème année collège</option>
        <option value="3ème année collège">3ème année collège</option>
        <option value="Tronc commun">Tronc commun</option>
        <option value="1ème année bac">1ème année bac</option>
        <option value="2ème année bac">2ème année bac</option>
      </select>
    </div>

    <div>
      <label for="mat">Matière</label>
      <select id="mat">
        <option value="">Toutes les matières</option>
        <option value="Français">Français</option>
        <option value="Anglais">Anglais</option>
        <option value="Mathematiques">Mathématiques</option>
        <option value="Informatique">Informatique</option>
        <option value="SVT">SVT</option>
        <option value="Arabe">Arabe</option>
      </select>
    </div>
  </div>

  <!-- cours + panier -->
  <main class="layout">
    <!-- les cartes de cours (remplies par le JS) -->
    <section id="catalogue" class="cataloge"></section>

    <!-- panier -->
    <aside class="panier">
      <h2>Mon panier</h2>
      <ul id="liste-panier"></ul>
      <div class="total">
        <strong>Total :</strong>
        <span id="prix-total">0</span> MAD / mois
      </div>
<button class="btn-inscription">Continuer l'inscription</button>

    </aside>
    
    
  </main>
  <div class="champ">
  <label for="nom">Nom du parent:</label>
  <input type="text" id="nom" name="nom">
  <label for="email">Email:</label>
  <input type="text" id="email" name="email">
  <label for="tel">Telephone:</label>
  <input type="text" id="tel" name="telephon">
  <label for="nom">Niveau-eleve:</label>
     <select id="niv">
        <option value="">Tous les niveaux</option>
        <option value="1ème année collège">1ème année collège</option>
        <option value="2ème année collège">2ème année collège</option>
        <option value="3ème année collège">3ème année collège</option>
        <option value="Tronc commun">Tronc commun</option>
        <option value="1ème année bac">1ème année bac</option>
        <option value="2ème année bac">2ème année bac</option>
      </select>
 <label for="tel">Password:</label>
  <input type="text" id="Password" name="password">
  <label >
      <input type="checkbox" id="consentement" name="consentement">
      J'accepte que mes données soient utilisées pour l'inscription
    </label>
<button type="button" class="btn-valider ">Valider l'inscription</button>
</div>

  <footer>
    <div class="pied">
      <p>Nour Academy · Ensemble pour la réussite</p>
      <p>Besoin d’aide ? Contactez-nous</p>
    </div>
  </footer>

  <script src="/js/script.js" defer></script>
</body>

</html>
